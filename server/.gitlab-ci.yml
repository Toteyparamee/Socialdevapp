stages:
  - build
  - deploy

variables:
  REGISTRY: registry.kpinnovative.co.th/paramee/server_socialdevapp
  KUBECONFIG: /root/.kube/config

# IMAGE_NAME  — ชื่อ image ใน registry  (เช่น activity-service)
# DEPLOY_NAME — ชื่อ deployment ใน k8s  (เช่น activity)
# SERVICE_DIR — ชื่อ folder ใน repo     (เช่น activity)

.build_service:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - runner-develop
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context .
      --dockerfile Dockerfile
      --build-arg SERVICE=$SERVICE_DIR
      --destination $REGISTRY/$IMAGE_NAME:latest
      --destination $REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - $SERVICE_DIR/**/*
        - shared/**/*
        - Dockerfile

.deploy_service:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - runner-develop
  script:
    - |
      if kubectl get deployment/$DEPLOY_NAME -n socialdev &>/dev/null; then
        kubectl rollout restart deployment/$DEPLOY_NAME -n socialdev
        kubectl rollout status deployment/$DEPLOY_NAME -n socialdev --timeout=120s
      else
        echo "Deployment $DEPLOY_NAME not found in namespace socialdev. Skipping rollout (initial deploy must be done manually)."
        exit 0
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - $SERVICE_DIR/**/*
        - shared/**/*
        - Dockerfile

# ─── activity ─────────────────────────────────────────────────────────────────
build:activity:
  extends: .build_service
  variables:
    IMAGE_NAME: activity-service
    DEPLOY_NAME: activity
    SERVICE_DIR: activity

deploy:activity:
  extends: .deploy_service
  needs: [build:activity]
  variables:
    IMAGE_NAME: activity-service
    DEPLOY_NAME: activity
    SERVICE_DIR: activity

