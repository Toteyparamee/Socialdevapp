stages:
  - build
  - deploy

variables:
  REGISTRY: registry.kpinnovative.co.th/paramee/server_socialdevapp
  KUBECONFIG: /root/.kube/config

# ─── shared Dockerfile ────────────────────────────────────────────────────────
# All services share server/Dockerfile with --build-arg SERVICE=<name>.
# Build context is server/ so the `replace ../shared` directive resolves.

.build_service:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  tags:
    - runner-develop
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(echo -n $CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD | base64)\"}}}" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context ./server
      --dockerfile Dockerfile
      --build-arg SERVICE=$SERVICE_DIR
      --destination $REGISTRY/$SERVICE_NAME:latest
      --destination $REGISTRY/$SERVICE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      changes:
        - server/$SERVICE_DIR/**/*
        - server/shared/**/*
        - server/Dockerfile

.deploy_service:
  stage: deploy
  image: bitnami/kubectl:latest
  tags:
    - runner-develop
  script:
    - kubectl rollout restart deployment/$SERVICE_NAME -n socialdevapp
    - kubectl rollout status deployment/$SERVICE_NAME -n socialdevapp --timeout=120s
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      changes:
        - server/$SERVICE_DIR/**/*
        - server/shared/**/*
        - server/Dockerfile

# ─── activity ─────────────────────────────────────────────────────────────────
build:activity:
  extends: .build_service
  variables:
    SERVICE_NAME: activity-service
    SERVICE_DIR: activity

deploy:activity:
  extends: .deploy_service
  needs: [build:activity]
  variables:
    SERVICE_NAME: activity-service
    SERVICE_DIR: activity

