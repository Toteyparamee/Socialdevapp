apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: socialdev

resources:
  # Namespace & shared config
  - namespace.yaml
  - configmap.yaml

  # Secrets
  - secrets/db-socialdev.yaml
  - secrets/jwt-secret.yaml
  - secrets/minio-secret.yaml

  # Infrastructure (Postgres อยู่ภายนอกที่ 10.194.1.43, Minio ที่ 10.194.1.44, Kafka รันใน kub)

  # Application services
  - apps/auth.yaml
  - apps/image.yaml
  - apps/problem.yaml
  - apps/activity.yaml
  - apps/chat.yaml
  - apps/notification.yaml
  - apps/analytics.yaml
